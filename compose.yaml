services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: technova-db
    hostname: sql1
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Error: MSSQL_SA_PASSWORD environment variable is not set. Please set it in the .env file.}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlvolume:/var/opt/mssql

volumes:
  sqlvolume: